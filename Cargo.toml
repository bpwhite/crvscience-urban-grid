[workspace]
members = [
    "crates/ug-core",
    "crates/ug-app",
]
resolver = "2"

[workspace.package]
version = "5.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/urban-grid"
rust-version = "1.81"

[workspace.dependencies]
bytemuck = { version = "1.18", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.36"
rayon = "1.10"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
